name: Restore public Taikonaut media

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Download real public brand photography
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import io, json, os, re, time, urllib.parse, urllib.request
          from PIL import Image

          OUT = "public/images"
          OFFICIAL = {
            "archive/mozdrian-sweater/front.webp": "https://assets.bigcartel.com/product_images/405884736/W+MOZDRIAN+F.jpg?auto=format&fit=max&w=2000",
            "archive/mozdrian-sweater/back.webp": "https://assets.bigcartel.com/product_images/405884733/W+MOZDRIAN+B.jpg?auto=format&fit=max&w=2000",
            "archive/macanica-tee/front.webp": "https://assets.bigcartel.com/product_images/404367174/WEBSITE+MAC%CC%A7.jpg?auto=format&fit=max&w=2000",
            "archive/macanica-tee/on-model.webp": "https://assets.bigcartel.com/product_images/405962835/CE88D04F-D4EC-42A8-B19E-3CC3C6DD2CC6.jpg?auto=format&fit=max&w=2000",
            "archive/macanica-tee/detail.webp": "https://assets.bigcartel.com/product_images/405962832/C9EF67C7-8492-49A7-ADC5-A19AECEC7262.JPG?auto=format&fit=max&w=2000",
            "archive/mafura-tee/front.webp": "https://assets.bigcartel.com/product_images/404953956/WEBSITE+MAFURA.jpg?auto=format&fit=max&w=2000",
            "archive/mafura-tee/on-model.webp": "https://assets.bigcartel.com/product_images/405962814/E2131F89-C2CF-4AE1-BC84-732223D7B5F3.jpg?auto=format&fit=max&w=2000",
            "archive/mafura-tee/detail.webp": "https://assets.bigcartel.com/product_images/405962742/8D4FBA5C-AA83-416C-9709-398E11D00C80.JPG?auto=format&fit=max&w=2000",
          }
          POSTS = [
            "Dfj5rVXuQlx", "DfMsq45DpuN", "De6rs0JjqEN", "DezSkY7uHGP",
            "DdLuHO1uNKj", "Dc5mEMvDmy-", "DctaaR2tpez", "DaqWuQfugPv",
            "DaNgABejNlr", "DaAaT77tvpY", "DZhudt8DJTp", "DYziel8DvjP",
          ]

          UA = {"User-Agent": "Mozilla/5.0 (compatible; TaikonautAssetRestore/1.0)"}

          def fetch(url, timeout=60):
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return r.read()

          def weserv(url, width):
              q = urllib.parse.urlencode({
                  "url": url,
                  "w": str(width),
                  "output": "jpg",
                  "q": "85",
              })
              return "https://wsrv.nl/?" + q

          def save(rel, url, width):
              target = os.path.join(OUT, rel)
              os.makedirs(os.path.dirname(target), exist_ok=True)
              data = fetch(weserv(url, width), timeout=90)
              img = Image.open(io.BytesIO(data)).convert("RGB")
              img.save(target, "WEBP", quality=82, method=6)
              print(f"OK  {rel}  {img.width}x{img.height}  {os.path.getsize(target)} bytes")
              return {"path": "/images/" + rel, "width": img.width, "height": img.height,
                      "bytes": os.path.getsize(target), "source": url}

          manifest = {"official": [], "instagram": []}

          for rel, url in OFFICIAL.items():
              for attempt in range(3):
                  try:
                      manifest["official"].append(save(rel, url, 1400))
                      break
                  except Exception as exc:
                      print(f"RETRY official {rel} ({attempt+1}): {exc}")
                      time.sleep(3)
              else:
                  raise RuntimeError(f"Failed official asset: {rel}")

          for post in POSTS:
              reader = f"https://r.jina.ai/https://www.instagram.com/p/{post}/"
              try:
                  text = fetch(reader, timeout=90).decode("utf-8", "replace")
              except Exception as exc:
                  print(f"SKIP jina {post}: {exc}")
                  continue
              urls = re.findall(r"https://scontent-[^)\s\"]+cdninstagram\.com/v/t51\.[0-9]+-15/[^)\s\"]+", text)
              urls = [u for u in urls if ("stp=dst-jpg_e35_tt6" in u or "stp=dst-jpg_e15_tt6" in u)]
              seen, picked = set(), []
              for u in urls:
                  key = u.split("?")[0]
                  if key not in seen:
                      seen.add(key)
                      picked.append(u)
              if not picked:
                  print(f"SKIP no media found for {post}")
                  continue
              for i, u in enumerate(picked[:3], start=1):
                  rel = f"instagram/{post}-{i}.webp"
                  for attempt in range(3):
                      try:
                          entry = save(rel, u, 1200)
                          entry["post"] = f"https://www.instagram.com/p/{post}/"
                          manifest["instagram"].append(entry)
                          break
                      except Exception as exc:
                          print(f"RETRY instagram {rel} ({attempt+1}): {exc}")
                          time.sleep(3)
              time.sleep(1)

          os.makedirs("artifacts", exist_ok=True)
          with open("artifacts/public-media-manifest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2, ensure_ascii=False)
          print(f"TOTAL official={len(manifest['official'])} instagram={len(manifest['instagram'])}")
          PY

      - name: Commit restored media to the working branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/archive public/images/instagram artifacts/public-media-manifest.json
          if git diff --cached --quiet; then
            echo "No new media to commit."
            exit 0
          fi
          git commit -m "Restore public brand photography from the official shop and Instagram [skip ci]"
          git push origin HEAD:"$BRANCH"
